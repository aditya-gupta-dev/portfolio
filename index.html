<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aditya Gupta - Software Engineer & Architect</title>
    
    <meta name="description" content="Portfolio of Aditya Gupta, Software Engineer & Architect. A vintage developer broadsheet showcasing major works, personal story, and academic distinctions." />
    <meta name="keywords" content="Aditya Gupta, Software Engineer, Architect, Portfolio, Developer, Go, Python, TypeScript, React, Kubernetes, Docker, AWS, System Design, Open Source" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/jpeg" sizes="192x192" href="/icon-192.jpg" />
    <link rel="apple-touch-icon" href="/icon-192.jpg" />
    
    <!-- Theme Color (monochrome to match design) -->
    <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)">

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://adityagupta.com/" />
    <meta property="og:title" content="Aditya Gupta - Developer Broadsheet" />
    <meta property="og:description" content="Portfolio of Aditya Gupta, Software Engineer & Architect. A vintage developer broadsheet." />
    <meta property="og:image" content="https://adityagupta.com/og-image.jpg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Aditya Gupta Portrait" />
    <meta property="og:site_name" content="Aditya Gupta" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Aditya Gupta - Developer Broadsheet" />
    <meta name="twitter:description" content="Portfolio of Aditya Gupta, Software Engineer & Architect." />
    <meta name="twitter:image" content="https://adityagupta.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Aditya Gupta Portrait" />
    
    <!-- Fonts: Playfair Display, Anton, Public Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Public+Sans:wght@700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#141210',
                        newsprint: '#f7f4ec',
                        hairline: '#cfc9ba'
                    },
                    fontFamily: {
                        playfair: ['"Playfair Display"', 'serif'],
                        anton: ['Anton', 'sans-serif'],
                        public: ['"Public Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom base styles to reinforce the print aesthetic */
        body {
            background-color: #f7f4ec;
            color: #141210;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .justified-text {
            text-align: justify;
            text-justify: inter-word;
            hyphens: auto;
        }
        
        .nameplate {
            font-size: clamp(3rem, 11vw, 138px);
        }
        
        .headline {
            font-size: clamp(2.5rem, 7vw, 89px);
        }

        /* Specific double border to match spec strictly */
        .double-rule-top {
            border-top: 3px double #141210;
        }
        
        /* High contrast selection */
        ::selection {
            background-color: #141210;
            color: #f7f4ec;
        }
    </style>
</head>
<body class="font-playfair p-4 sm:p-8 md:p-12 selection:bg-ink selection:text-newsprint">
    
    <div id="portfolio-root" class="max-w-[1400px] mx-auto">
        <!-- Content will be injected here via JavaScript -->
    </div>

    <script>
        // ---------------------------------------------------------
        // PORTFOLIO CONFIGURATION OBJECT
        // Edit the details below to update the broadsheet content
        // ---------------------------------------------------------
        const portfolioData = {
            meta: {
                eyebrow: "Vol. I • Developer Broadsheet • Edition 2026",
                nameplate: "Aditya Gupta",
                headline: "Software Engineer & Architect",
                footerText: "PRINTED & PUBLISHED GLOBALLY FOR THE ADVANCEMENT OF COMPUTING AND LOGIC."
            },
            contact: {
                email: "adityagupta@tutanota.de",
                phone: "+91 8127543896",
                linkedin: "linkedin.com/in/aditya-gupta-oss",
                github: "github.com/aditya-gupta-dev"
            },
            skills: {
                languages: "Javascript, Typescript, Python, Java, Golang, Rust, C++, C#, SQL.",
                tools: "Postgres, Google Cloud, Github, Sentry, Linux, Kubernetes, AWS, Huggingface.",
                soft: "Communication, Leadership, Teamwork, Social Media Marketing."
            },
            about: {
                title: "About Me",
                summary: "A software engineer & architect with an obsession for systems that are fast, resilient, and beautifully simple. I spend my days designing backends and pipelines, my nights reading kernel source, and my weekends arguing about fonts on the internet.",
                traits: [
                    "Systems thinker — I debug from the kernel up, not the console down.",
                    "Performance purist — milliseconds matter, memory footprints matter more.",
                    "Open source believer — good software, like good journalism, should be free to read."
                ],
                currently: "Pursuing a B.Tech in Computer Science at Lovely Professional University while building tools, contributing to open source, and preparing for a career in systems engineering.",
                hobbies: "Beyond my technical pursuits, I dedicate time to wrestling and mixed martial arts (MMA), building physical endurance, strategic thinking, and absolute composure under pressure. In my quieter moments, I turn to astronomy, observing celestial phenomena and studying the cosmos, driven by a deep curiosity for the mechanics of the universe."
            },
            achievements: [
                "Emerged victorious in an intense 1-versus-5 coding Hackathon held at ITM Gorakhpur, demonstrating supreme technical agility.",
                "Secured the distinguished 3rd place in a highly competitive debate competition conducted in honor of National Space Day."
            ],
            education: [
                {
                    institution: "Lovely Professional University",
                    location: "Phagwara, Punjab",
                    degree: "Bachelor of Technology (CSE)",
                    score: "CGPA: 8.56",
                    date: "Aug '25 – Present"
                },
                {
                    institution: "Don Bosco Senior Secondary",
                    location: "Gorakhpur, UP",
                    degree: "Intermediate",
                    score: "Percentage: 69%",
                    date: "Mar '24 – May '25"
                }
            ]
        };

        function renderPortfolio(data) {
            const root = document.getElementById('portfolio-root');
            
            // --- Build Header ---
            const headerHTML = `
                <header class="w-full mb-6 sm:mb-10">
                    <!-- Top Rule (2px + 1px) -->
                    <div class="border-t-[2px] border-ink mb-[2px] w-full"></div>
                    <div class="border-t-[1px] border-ink mb-3 sm:mb-5 w-full"></div>
                    
                    <!-- Eyebrow -->
                    <p class="font-public font-bold text-[14px] sm:text-[18px] tracking-[0.34em] uppercase text-center mb-2 sm:mb-4">
                        ${data.meta.eyebrow}
                    </p>
                    
                    <!-- Nameplate -->
                    <h1 class="nameplate font-playfair font-bold leading-[0.85] text-center uppercase mb-3 sm:mb-6 tracking-tighter">
                        ${data.meta.nameplate}
                    </h1>
                    
                    <!-- Double Rule Nameplate Divider -->
                    <div class="double-rule-top mb-4 sm:mb-8 w-full"></div>
                    
                    <!-- Main Headline -->
                    <h2 class="headline font-anton uppercase leading-[0.9] text-center mb-6 sm:mb-10 tracking-tight">
                        ${data.meta.headline}
                    </h2>
                    
                    <!-- Top Rule (1px) before content -->
                    <div class="border-t border-ink mb-1 w-full"></div>
                    <div class="border-t-[2px] border-ink mb-6 sm:mb-10 w-full"></div>
                </header>
            `;

            // --- Build Column 1: Intro, Contact, Skills ---
            const contactHTML = `
                <div class="mb-8">
                    <h3 class="font-anton text-[24px] sm:text-[32px] uppercase border-b-2 border-ink pb-1 mb-3">Contact</h3>
                    <ul class="font-playfair text-[17px] sm:text-[20px] leading-tight space-y-2 mb-6">
                        <li class="flex flex-col"><span class="font-bold text-[14px] uppercase tracking-wider">Email</span> ${data.contact.email}</li>
                        <li class="flex flex-col"><span class="font-bold text-[14px] uppercase tracking-wider">Phone</span> ${data.contact.phone}</li>
                        <li class="flex flex-col"><span class="font-bold text-[14px] uppercase tracking-wider">GitHub</span> ${data.contact.github}</li>
                        <li class="flex flex-col"><span class="font-bold text-[14px] uppercase tracking-wider">LinkedIn</span> ${data.contact.linkedin}</li>
                    </ul>
                </div>
            `;

            const skillsHTML = `
                <div class="mb-8">
                    <h3 class="font-anton text-[24px] sm:text-[32px] uppercase border-b-2 border-ink pb-1 mb-3">Skills</h3>
                    <div class="font-playfair text-[17px] sm:text-[20px] leading-snug space-y-4 justified-text">
                        <p><strong class="uppercase text-[16px] tracking-wide">Languages:</strong><br/> ${data.skills.languages}</p>
                        <p><strong class="uppercase text-[16px] tracking-wide">Infrastructure:</strong><br/> ${data.skills.tools}</p>
                        <p><strong class="uppercase text-[16px] tracking-wide">Soft Skills:</strong><br/> ${data.skills.soft}</p>
                    </div>
                </div>
            `;

            const educationHTML = `
                <div class="mb-8">
                    <h3 class="font-anton text-[24px] sm:text-[32px] uppercase border-b-2 border-ink pb-1 mb-3">Education</h3>
                    <div class="space-y-5">
                        ${data.education.map(edu => `
                            <div>
                                <h4 class="font-bold text-[18px] sm:text-[22px] leading-tight uppercase">${edu.institution}</h4>
                                <p class="font-public font-bold text-[12px] tracking-widest uppercase mb-1">${edu.date} • ${edu.location}</p>
                                <p class="text-[17px] sm:text-[19px] italic">${edu.degree}</p>
                                <p class="text-[17px] sm:text-[19px]">${edu.score}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            const aboutHTML = `
                <div class="mb-8">
                    <h3 class="font-anton text-[24px] sm:text-[32px] uppercase border-b-2 border-ink pb-1 mb-4">About Me</h3>
                    <p class="font-playfair text-[17px] sm:text-[21px] leading-relaxed justified-text mb-6">
                        <span class="float-left text-[50px] sm:text-[65px] font-black leading-[0.8] pr-2 pt-1 uppercase">${data.about.summary.charAt(0)}</span>
                        ${data.about.summary.substring(1)}
                    </p>
                    <ul class="font-playfair text-[17px] sm:text-[21px] leading-snug space-y-4 justified-text mb-6">
                        ${data.about.traits.map(trait => `
                            <li class="relative pl-4">
                                <span class="absolute left-0 top-0 font-bold">•</span>
                                ${trait}
                            </li>
                        `).join('')}
                    </ul>
                    <p class="font-playfair text-[17px] sm:text-[21px] leading-relaxed justified-text italic border-t border-hairline pt-4 mb-4">
                        ${data.about.currently}
                    </p>
                    <p class="font-playfair text-[17px] sm:text-[21px] leading-relaxed justified-text">
                        <strong class="uppercase text-[16px] tracking-wide">Hobbies & Pursuits:</strong> ${data.about.hobbies}
                    </p>
                </div>
            `;

            const imagePlaceholderHTML = `
                <div class="mb-0 lg:mb-8">
                    <div class="w-full aspect-[3/4] border-2 border-ink p-1">
                        <div class="w-full h-full border border-ink relative overflow-hidden group bg-[#eae5d5]">
                            <div class="absolute inset-0 bg-cover bg-center bg-no-repeat blur-md transition-opacity duration-700" style="background-image: url('./profile-pic-vintage-lowres.webp')"></div>
                            <img 
                                src="./profile-pic-vintage.webp"
                                alt="Author Portrait" 
                                class="w-full h-full object-cover relative z-10 opacity-0 transition-opacity duration-700"
                                onload="this.classList.remove('opacity-0'); this.previousElementSibling.classList.add('opacity-0');"
                            />
                        </div>
                    </div>
                    <p class="font-public text-[10px] uppercase tracking-widest text-center mt-2">Figure 1. The Author</p>
                </div>
            `;

            const achievementsHTML = `
                <div class="mb-0 lg:mb-8">
                    <h3 class="font-anton text-[24px] sm:text-[32px] uppercase border-b-2 border-ink pb-1 mb-3">Achievements</h3>
                    <ul class="font-playfair text-[17px] sm:text-[21px] leading-snug space-y-4 justified-text">
                        ${data.achievements.map(ach => `
                            <li class="relative pl-4">
                                <span class="absolute left-0 top-0 font-bold">•</span>
                                ${ach}
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `;

            const footerHTML = `
                <footer class="w-full mt-8 sm:mt-12 mb-4">
                    <div class="border-t-[2px] border-ink mb-1 w-full"></div>
                    <div class="border-t border-ink mb-4 w-full"></div>
                    <p class="font-public text-[11px] sm:text-[14px] uppercase tracking-widest text-center font-bold">
                        ${data.meta.footerText}
                    </p>
                    <div class="border-t border-ink mt-4 w-full"></div>
                </footer>
            `;

            const mainLayout = `
                <main class="flex flex-col lg:flex-row gap-8 lg:gap-8 w-full border-b-[2px] border-ink pb-8">
                    
                    <!-- Left Column -->
                    <div class="lg:w-[25%] lg:border-r border-hairline lg:pr-8 flex flex-col gap-8 lg:gap-2">
                        <div class="block lg:hidden">
                            ${imagePlaceholderHTML}
                        </div>
                        ${contactHTML}
                        ${skillsHTML}
                        <div class="hidden lg:block">
                            ${educationHTML}
                        </div>
                    </div>

                    <!-- Center Column (Main body) -->
                    <div class="lg:w-[50%] lg:border-r border-hairline lg:pr-8 mt-0 flex flex-col gap-8 lg:gap-0">
                        ${aboutHTML}
                        <div class="block lg:hidden">
                            ${educationHTML}
                        </div>
                    </div>

                    <!-- Right Column -->
                    <div class="lg:w-[25%] mt-0 flex flex-col gap-8 lg:gap-2">
                        <div class="hidden lg:block">
                            ${imagePlaceholderHTML}
                        </div>
                        ${achievementsHTML}
                    </div>
                    
                </main>
            `;

            // Inject all pieces into the DOM
            root.innerHTML = headerHTML + mainLayout + footerHTML;
        }

        // Initialize Render
        window.addEventListener('DOMContentLoaded', () => {
            renderPortfolio(portfolioData);
        });

        // Register Service Worker for caching
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }, err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
