                                    ${proj.bullets.map(bullet => `
                                        <li class="relative pl-4">
                                            <span class="absolute left-0 top-0 font-bold text-[14px]">•</span>
                                            ${bullet}
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            // --- Footer HTML ---
            const footerHTML = `
                <footer class="w-full mt-4 sm:mt-8 mb-4">
                    <div class="border-t-[1px] border-ink mb-1 w-full"></div>
                    <div class="border-t-[2px] border-ink mb-4 w-full"></div>
                    <p class="font-public text-[11px] sm:text-[14px] uppercase tracking-widest text-center font-bold">
                        ${data.meta.footerText}
                    </p>
                    <div class="border-t-[1px] border-ink mt-4 w-full"></div>
                </footer>
            `;

            const mainLayout = `
                <main class="flex flex-col w-full">
                    <!-- Top 3-column row -->
                    <div class="flex flex-col lg:flex-row gap-8 lg:gap-8 w-full border-b-[2px] border-ink pb-8 mb-8">
                        <!-- Left Column -->
                        <div class="lg:w-[25%] lg:border-r border-hairline lg:pr-8 flex flex-col gap-8 lg:gap-2">
                            <div class="block lg:hidden">
                                ${imagePlaceholderHTML}
                            </div>
                            ${contactHTML}
                            ${softSkillsHTML}
                            <div class="hidden lg:block">
                                ${educationHTML}
                            </div>
                        </div>

                        <!-- Center Column (Main body) -->
                        <div class="lg:w-[50%] lg:border-r border-hairline lg:pr-8 mt-0 flex flex-col gap-8 lg:gap-0">
                            ${aboutHTML}
                            ${experienceHTML}
                            <div class="block lg:hidden">
                                ${educationHTML}
                            </div>
                        </div>

                        <!-- Right Column -->
                        <div class="lg:w-[25%] mt-0 flex flex-col gap-8 lg:gap-2">
                            <div class="hidden lg:block">
                                ${imagePlaceholderHTML}
                            </div>
                            ${achievementsHTML}
                        </div>
                    </div>

                    <!-- Giant Skills Row -->
                    ${giantSkillsHTML}

                    <!-- Projects Row -->
                    ${projectsHTML}

                </main>
            `;

            // Inject all pieces into the DOM
            root.innerHTML = headerHTML + mainLayout + footerHTML;
        }

        // Initialize Render
        window.addEventListener('DOMContentLoaded', () => {
            renderPortfolio(portfolioData);
        });

        // Register Service Worker for caching
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }, err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
